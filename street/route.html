<!doctype html>

<style>

nav { display: flex; flex-wrap: wrap; gap: 8px }

<body>
<main>

  <p><a href="index.html?lite">Открыть 3D в лёгком режиме</a></p>
  <nav aria-label="Остановки">

  <section id="low">
